name: Atualizar e publicar Radar Diário

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Lisbon'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || vars.AUTO_PUBLISH_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Gerar edição diária
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-sol
        run: python scripts/publish_daily.py

      - name: Guardar edição no arquivo
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- data/editions.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/editions.json
            git commit -m "Publica edição diária $(date +'%Y-%m-%d')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
